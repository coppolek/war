/* Layout: schermo intero, canvas isometrico + HUD disegnato sul canvas.
   Palette: sabbia, ambra radar, verde oliva, rosso allarme. Gioco a tema unico (scuro). */

<script>
(()=>{
'use strict';
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,Z=1,HS=1;
const FONT='"Chakra Petch","Segoe UI",system-ui,sans-serif';
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth||innerWidth;H=cv.clientHeight||innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  Z=Math.max(0.55,Math.min(1.5,Math.min(W/1000,H/620)));
  HS=Math.max(0.72,Math.min(1.25,Math.min(W/900,H/560)));
}
addEventListener('resize',resize);resize();

/* ---------- utilità ---------- */
const TAU=Math.PI*2;
const cl=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const angDiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d};
function mkRng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mkNoise(r,n){const g=[];for(let i=0;i<=n+1;i++){g[i]=[];for(let j=0;j<=n+1;j++)g[i][j]=r();}
  const s=t=>t*t*(3-2*t);
  return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),u=s(x-xi),v=s(y-yi);
    const a=g[xi][yi],b=g[xi+1][yi],c=g[xi][yi+1],d=g[xi+1][yi+1];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}}

/* ---------- audio ---------- */
let AC=null,muted=false,nbuf=null;
function initAudio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();
    nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f,d,type,v,slide){
  if(!AC||muted)return;try{
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(25,f+slide),t+d);
  g.gain.setValueAtTime(v||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}
function noise(d,v,f){
  if(!AC||muted||!nbuf)return;try{
  const t=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;fl.type='lowpass';
  fl.frequency.setValueAtTime(f||900,t);fl.frequency.exponentialRampToValueAtTime(80,t+d);
  g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d);}catch(e){}
}
const sfx={
  gun(){tone(520,.05,'square',.018,-300)},
  rkt(){noise(.25,.12,2200);tone(220,.2,'sawtooth',.03,-120)},
  hel(){noise(.5,.2,1800);tone(160,.45,'sawtooth',.05,-90)},
  boom(big){noise(big?1.1:.5,big?.5:.28,big?1100:700);tone(90,big?.6:.3,'sine',big?.2:.1,-50)},
  hit(){tone(140,.12,'sawtooth',.06,-60)},
  pick(){tone(660,.08,'triangle',.06);setTimeout(()=>tone(990,.1,'triangle',.06),70)},
  warn(){tone(880,.1,'square',.03)},
  eshot(){tone(300,.06,'square',.012,-120)}
};

/* ---------- mondo ---------- */
const N=120,T=48,WS=N*T,KM=2.4;
const terr=new Uint8Array(N*N),tcol=new Array(N*N),bld=new Uint8Array(N*N);
const PAL=[[226,204,160],[182,176,164],[138,134,124],[160,146,126],[66,68,72],[44,112,140],[156,156,148],[86,128,64],[66,68,72],[66,68,72]];
let en=[],pows=[],crates=[],decor=[],bul=[],part=[],decals=[],dunes=[];
let eid=0;

/* ---------- multiplayer co-op (capability "room") ---------- */
const net={code:'',on:false,room:null,host:true,peers:[],idx:0,ghosts:{},dead:new Set(),snap:{},dmg:new Map(),tp:0,ts:0,td:0,tst:0,err:'',ready:false};
const CALL=['ALFA','BRAVO','CHARLIE','DELTA','ECHO','FOXTROT'];
const HC=[[78,88,68],[64,92,136],[160,112,56],[112,74,128],[56,116,110],[134,58,56]];
const MOBILE={tank:1,jeep:1,truck:1,heli:1};
const btns=[];let lobbyCopied=0;
const num=v=>typeof v==='number'&&isFinite(v);
const h01=n=>{let t=Math.imul(n+1,2654435761)>>>0;t=Math.imul(t^t>>>15,2246822519)>>>0;return((t^t>>>13)>>>0)/4294967296};
function netSend(t,d){if(net.on&&net.room){try{net.room.emit(t,d||{}).catch(()=>{})}catch(e){}}}

/* ---------- rete standalone: adattatore WebSocket con la stessa interfaccia di "room" ---------- */
function wsRoom(){
  return new Promise(resolve=>{
    const url=window.RG_WS||((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
    let ws;try{ws=new WebSocket(url)}catch(e){return resolve(null)}
    const H={},peers=new Map();let peerCb=null,closeCb=null,me=null,done=false;
    const emitPeers=j=>{if(!peerCb)return;peerCb({peers:[...peers.values()].sort((a,b)=>a.peer<b.peer?-1:1),joined:j||[]})};
    const raw=o=>{if(ws.readyState===1)ws.send(JSON.stringify(o))};
    const room={
      onPeers(cb,cl){peerCb=cb;closeCb=cl;emitPeers([])},
      on(t,f){H[t]=f},
      emit(t,d){raw({k:'e',t,d});return Promise.resolve()},
      presence(o){const m=peers.get(me);if(!m)return Promise.resolve();Object.assign(m.presence,o);if(ws.bufferedAmount<32768)raw({k:'p',d:m.presence});return Promise.resolve()}
    };
    const to=setTimeout(()=>{if(!done){done=true;try{ws.close()}catch(e){}resolve(null)}},7000);
    ws.onopen=()=>{raw({k:'join',room:new URLSearchParams(location.search).get('r')||''})};
    ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
      if(m.k==='welcome'){me=m.id;net.code=m.room;peers.clear();
        for(const p of m.peers)peers.set(p.peer,{peer:p.peer,kind:'viewer',isMe:p.peer===me,presence:p.p||{},updatedAt:Date.now()});
        if(!done){done=true;clearTimeout(to);resolve(room)}emitPeers([])}
      else if(m.k==='join'){const o={peer:m.peer,kind:'viewer',isMe:false,presence:{},updatedAt:Date.now()};peers.set(m.peer,o);emitPeers([o])}
      else if(m.k==='left'){peers.delete(m.id);emitPeers([])}
      else if(m.k==='p'){const o=peers.get(m.id);if(o){o.presence=m.d;o.updatedAt=Date.now()}}
      else if(m.k==='e'){const f=H[m.t];if(f)f({isMe:false,data:m.d,from:m.from})}
      else if(m.k==='full'){net.err='Stanza piena (massimo 6 piloti). Riprova o usa un altro codice stanza.';if(!done){done=true;clearTimeout(to);resolve(null)}}
    };
    ws.onclose=()=>{if(!done){done=true;clearTimeout(to);resolve(null)}else if(closeCb)closeCb()};
    ws.onerror=()=>{};
  });
}
async function netConnect(){
  if(net.room===false)net.room=null;
  net.err='';
  if(net.room===null){
    try{let c=(window.claude&&window.claude.use)?await window.claude.use('room'):null;if(!c&&window.RG_STANDALONE)c=await wsRoom();net.room=c||false}catch(e){net.room=false}
    if(net.room)netWire();
  }
  if(!net.room){if(!net.err)net.err=window.RG_STANDALONE?'Impossibile collegarsi al server di gioco. Controlla la connessione e riprova.':'Multiplayer non disponibile qui. Apri il link da un account invitato con accesso da Collaboratore (non da link pubblico).';return false}
  net.ready=true;netSend('hello');return true;
}
function netWire(){
  const r=net.room;
  r.onPeers(ch=>{
    const v=ch.peers.filter(p=>p.kind==='viewer').slice().sort((a,b)=>a.peer<b.peer?-1:1);
    net.peers=v;net.idx=Math.max(0,v.findIndex(p=>p.isMe));net.host=net.idx===0;
    if(net.on&&net.host&&ch.joined.some(p=>!p.isMe&&p.kind==='viewer'))sendState();
  },()=>{net.room=false;net.err='Connessione al multiplayer persa.'});
  r.on('hello',m=>{if(!m.isMe&&net.host&&net.on)sendState()});
  r.on('state',m=>{if(!m.isMe&&net.on)applyState(m.data)});
  r.on('dmg',m=>{if(m.isMe||!net.on||!m.data||!Array.isArray(m.data.l))return;for(const q of m.data.l){if(!Array.isArray(q)||!num(q[0])||!num(q[1]))continue;const e=en.find(x=>x.id===q[0]);if(e)hurt(e,q[1],true)}});
  r.on('kill',m=>{if(m.isMe||!net.on||!m.data)return;const e=en.find(x=>x.id===m.data.id);if(e)destroy(e,true)});
  r.on('pow',m=>{if(m.isMe||!net.on||!m.data)return;const p=pows[m.data.i];if(p&&p.st==='wait')p.st='gone'});
  r.on('goal',m=>{if(m.isMe||!net.on||!m.data||!num(m.data.n))return;const n=cl(m.data.n|0,0,4);goal.pow+=n;score+=n*300;say(n+' prigionieri in salvo!  '+goal.pow+'/'+M.pow,3.2)});
  r.on('win',m=>{if(!m.isMe&&net.on&&state==='play'){score+=1000;state='success'}});
  r.on('next',m=>{if(m.isMe||!net.on||!m.data||!MISSIONS[m.data.mi]||m.data.mi<=mi)return;if(state==='success'||state==='play'||state==='brief'||state==='hangar'){loadMission(m.data.mi);goHangar()}});
  r.on('cpk',m=>{if(m.isMe||!net.on||!m.data)return;const i=crates.findIndex(c=>c.id===m.data.id);if(i>=0)crates.splice(i,1)});
  r.on('snap',m=>{if(m.isMe||!net.on||!m.data||!Array.isArray(m.data.e))return;const t=performance.now();for(const s of m.data.e){if(Array.isArray(s)&&num(s[0])&&num(s[1])&&num(s[2]))net.snap[s[0]]={x:s[1],y:s[2],a:(s[3]||0)/100,t}}});
}
function sendState(){netSend('state',{mi,g:goal,d:[...net.dead].slice(0,300),p:pows.map((p,i)=>p.st==='gone'?i:-1).filter(i=>i>=0),s:score})}
function applyState(d){
  if(!d||!MISSIONS[d.mi]||d.mi<mi)return;
  if(d.mi>mi){loadMission(d.mi);if(state==='play'||state==='success'||state==='brief')goHangar()}
  if(d.g)for(const k of['radar','depot','pow','scud','hq'])if(num(d.g[k]))goal[k]=Math.max(goal[k],d.g[k]|0);
  if(Array.isArray(d.d))for(const id of d.d){const i=en.findIndex(x=>x.id===id);if(i>=0){en.splice(i,1);net.dead.add(id)}}
  if(Array.isArray(d.p))for(const i of d.p)if(pows[i]&&pows[i].st==='wait')pows[i].st='gone';
  if(num(d.s))score=Math.max(score,d.s|0);
}
function netFollow(dt){
  const k=Math.min(1,dt*5),now=performance.now();
  for(const e of en){if(!MOBILE[e.t])continue;const s=net.snap[e.id];if(!s||now-s.t>2500)continue;e.x+=(s.x-e.x)*k;e.y+=(s.y-e.y)*k;e.ang+=angDiff(e.ang,s.a)*k*.6}
}
function netTick(dt){
  if(!net.on||!net.room)return;
  net.tp+=dt;
  if(net.tp>=1/15){net.tp=0;
    try{net.room.presence({m:mi,x:Math.round(pl.x),y:Math.round(pl.y),vx:Math.round(pl.vx),vy:Math.round(pl.vy),h:Math.round(pl.h*100)/100,z:Math.round(pl.z),al:(state==='play'&&pl.alive)?1:0,f:pl.fb|0,pw:pl.pow,hm:pl.hm|0}).catch(()=>{})}catch(e){}}
  if(state==='play'){
    net.td+=dt;
    if(net.td>=.2){net.td=0;if(net.dmg.size){const l=[];for(const [id,d] of net.dmg){l.push([id,Math.round(d*10)/10]);if(l.length>=100)break}net.dmg.clear();netSend('dmg',{l})}}
    if(net.host){net.ts+=dt;if(net.ts>=.4){net.ts=0;const e=[];for(const x of en)if(MOBILE[x.t])e.push([x.id,Math.round(x.x),Math.round(x.y),Math.round(x.ang*100)]);if(e.length)netSend('snap',{e})}}
  }
  if(net.host){net.tst+=dt;if(net.tst>=3){net.tst=0;sendState()}}
  netGhosts(dt);
}
function netGhosts(dt){
  const seen={};
  net.peers.forEach((p,i)=>{
    if(p.isMe)return;const pr=p.presence||{};
    if(pr.m!==mi||!pr.al||!num(pr.x)||!num(pr.y))return;
    let g=net.ghosts[p.peer];
    if(!g)g=net.ghosts[p.peer]={x:pr.x,y:pr.y,h:num(pr.h)?pr.h:0,z:num(pr.z)?pr.z:34,rot:0,fcd:0,rcd:0,hcd:0,alive:true,flash:0,winch:0,idx:i,tag:'',pw:0};
    const age=Math.min(.3,Math.max(0,(Date.now()-p.updatedAt)/1000)),tx=pr.x+(num(pr.vx)?pr.vx:0)*age,ty=pr.y+(num(pr.vy)?pr.vy:0)*age,k=Math.min(1,dt*10);
    g.x+=(tx-g.x)*k;g.y+=(ty-g.y)*k;g.h+=angDiff(g.h,num(pr.h)?pr.h:g.h)*k;g.z+=((num(pr.z)?pr.z:34)-g.z)*k;g.rot+=dt*34;g.idx=i;g.tag=CALL[i%6];g.hm=num(pr.hm)?pr.hm|0:0;
    const f=pr.f|0,c=Math.cos(g.h),s=Math.sin(g.h);
    if(state==='play'){
      if(f&1){g.fcd-=dt;if(g.fcd<=0){g.fcd=.075;shoot({own:2,kind:'g',x:g.x+c*18,y:g.y+s*18,z:g.z-1,vx:c*720,vy:s*720,vz:(10-g.z)/.5,life:.5})}}
      if(f&2){g.rcd-=dt;if(g.rcd<=0){g.rcd=.22;shoot({own:2,kind:'r',x:g.x+c*14,y:g.y+s*14,z:g.z-3,vx:c*520,vy:s*520,vz:(10-g.z)/.9,life:.9})}}
      if(f&4){g.hcd-=dt;if(g.hcd<=0){g.hcd=.7;shoot({own:2,kind:'h',x:g.x+c*10,y:g.y+s*10,z:g.z-4,vx:c*430,vy:s*430,vz:(10-g.z)/1.4,life:1.4})}}
    }
    seen[p.peer]=1;
  });
  for(const k in net.ghosts)if(!seen[k])delete net.ghosts[k];
}
function enterLobby(){
  initAudio();net.on=true;net.err='';state='lobby';lives=3;score=0;pl.gun=500;pl.rkt=24;pl.hel=8;
  loadMission(0);netConnect();
}
function netLeave(){net.on=false;net.ghosts={};if(net.room){try{net.room.presence({al:0}).catch(()=>{})}catch(e){}}}
function leaveLobby(){netLeave();loadMission(0);state='title'}
function startMP(){lives=3;pl.gun=Math.max(pl.gun,500);pl.rkt=Math.max(pl.rkt,24);pl.hel=Math.max(pl.hel,8);goHangar()}
const base={x:312,y:312};
let R=Math.random;
const tileAt=(x,y)=>{const i=Math.floor(x/T),j=Math.floor(y/T);return(i<0||j<0||i>=N||j>=N)?5:terr[j*N+i]};

const DEF={
  tank:{hp:5,r:17,sc:200},aa:{hp:4,r:13,sc:150},sam:{hp:5,r:15,sc:250},inf:{hp:1,r:8,sc:50},
  truck:{hp:2,r:15,sc:100},radar:{hp:10,r:25,sc:500,obj:1},depot:{hp:8,r:23,sc:600,obj:1},
  jeep:{hp:2,r:13,sc:120},bunker:{hp:12,r:22,sc:300},heli:{hp:6,r:18,sc:400},
  scud:{hp:8,r:23,sc:700,obj:1},hq:{hp:16,r:30,sc:900,obj:1}
};
const allDone=()=>goal.radar>=M.radar&&goal.depot>=M.depot&&goal.pow>=M.pow&&goal.scud>=(M.scud||0)&&goal.hq>=(M.hq||0);
const MISSIONS=[
  {name:'OPERAZIONE RIVIERA',txt:'Distruggi le stazioni radar piazzate lungo il lungomare e recupera i prigionieri. Poi rientra all\'aeroporto Fellini.',seed:7,radar:3,depot:0,pow:2,aa:8,sam:3,tank:6,inf:14,jeep:2},
  {name:'PONTE DI TIBERIO',txt:'Colpisci radar e depositi di carburante tra il Marecchia e il centro, poi porta in salvo i prigionieri.',seed:21,radar:2,depot:3,pow:3,aa:12,sam:5,tank:9,inf:20,jeep:3,bunker:2},
  {name:'ASSALTO AL PORTO',txt:'Offensiva sul porto canale: radar, depositi e prigionieri. La contraerea \u00e8 sui tetti degli hotel.',seed:42,radar:3,depot:4,pow:4,aa:16,sam:8,tank:12,inf:26,jeep:5,bunker:3,heli:1},
  {name:'CACCIA AI LANCIAMISSILI',txt:'Distruggi i lanciamissili mobili nascosti tra i quartieri prima del lancio, spegni il radar e salva i prigionieri. Elicotteri nemici in zona.',seed:63,scud:3,radar:1,depot:0,pow:2,aa:14,sam:7,tank:10,inf:24,jeep:6,bunker:3,heli:2},
  {name:'CENTRO STORICO',txt:'Assalta il quartier generale nemico vicino a Castel Sismondo, protetto da bunker e blindati. Porta in salvo i prigionieri.',seed:88,hq:1,radar:2,depot:2,pow:3,aa:16,sam:8,tank:12,inf:28,jeep:6,bunker:8,heli:3},
  {name:'ALBA SU RIMINI',txt:'Offensiva finale: lanciamissili, due quartieri generali, radar e depositi. Sopravvivi e riporta tutti a casa.',seed:101,scud:2,hq:2,radar:2,depot:3,pow:4,aa:20,sam:10,tank:14,inf:32,jeep:8,bunker:8,heli:5}
];
let mi=0,M=MISSIONS[0],goal={radar:0,depot:0,pow:0,scud:0,hq:0};

function mkEnemy(t,x,y){
  const D=DEF[t];const e={id:++eid,t,x,y,hp:D.hp,mhp:D.hp,r:D.r,ang:rnd(0,TAU),tang:rnd(0,TAU),cd:rnd(1,3),flash:0,burst:0,rot:rnd(0,6),home:{x,y},wp:null,obj:!!D.obj,tick:0};
  en.push(e);return e;
}
function findSpot(minBase,minSep,pts){
  for(let n=0;n<500;n++){
    const x=R()*(WS-6*T)+3*T,y=R()*((ySpan[1]-ySpan[0])*T)+ySpan[0]*T,tt=tileAt(x,y);
    if(dist(x,y,base.x,base.y)<minBase||tt===5||bld[(y/T|0)*N+(x/T|0)])continue;
    if(pts.some(p=>dist(x,y,p.x,p.y)<minSep))continue;
    return{x,y};
  }
  return{x:R()*(WS-8*T)+4*T,y:R()*(WS-8*T)+4*T};
}
function around(p,t,n,r0,r1){
  const out=[];
  for(let k=0;k<n;k++){
    const a=R()*TAU,d=r0+R()*(r1-r0),x=p.x+Math.cos(a)*d,y=p.y+Math.sin(a)*d;
    if(x<2*T||y<2*T||x>WS-2*T||y>WS-2*T||tileAt(x,y)===5||bld[(y/T|0)*N+(x/T|0)])continue;
    out.push(mkEnemy(t,x,y));
  }
  return out;
}
function genTerrain(){

const tbtn=()=>{const w=W,h=H;return[

addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  initAudio();if(!keys[e.code])onKey(e.code);keys[e.code]=true;
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{if(state==='play'&&!net.on)state='pause'});
function onKey(c){
  if(state==='hangar'){const n=HELIS.length;if(c==='ArrowLeft'||c==='KeyA'||c==='ArrowUp'||c==='KeyW'){hsel=(hsel+n-1)%n;return}if(c==='ArrowRight'||c==='KeyD'||c==='ArrowDown'||c==='KeyS'){hsel=(hsel+1)%n;return}if(c==='Escape'&&net.on)return}
  if(c==='Escape'&&state==='lobby'){leaveLobby();return}
  if(state==='title'&&c==='Digit2'){enterLobby();return}
  if(c==='Enter'||(c==='Space'&&state!=='play'&&state!=='pause'))advance();
  else if(c==='KeyP'||c==='Escape'){if(net.on)return;if(state==='play')state='pause';else if(state==='pause')state='play'}
  else if(c==='KeyM')muted=!muted;
  else if(state==='pause'&&c==='Space')state='play';
}
function advance(){
  initAudio();
  if(state==='title'){net.on=false;lives=3;score=0;pl.gun=500;pl.rkt=24;pl.hel=8;loadMission(0);goHangar()}
  else if(state==='lobby'){if(net.err&&!net.room)return;startMP()}
  else if(state==='hangar'){applyHeli();state='brief'}
  else if(state==='brief')state='play';
  else if(state==='success'){if(mi+1>=MISSIONS.length)state='win';else{netSend('next',{mi:mi+1});loadMission(mi+1);goHangar()}}
  else if(state==='over'||state==='win'){netLeave();loadMission(0);state='title'}
  else if(state==='pause')state='play';
}
function touchPos(t){const r=cv.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top}}
function touchSync(e){
  e.preventDefault();isTouch=true;initAudio();
  tb.fire=tb.rkt=tb.hel=tb.use=false;let joy=false;
  for(const t of e.touches){
    const p=touchPos(t);let hitBtn=false;
    for(const b of tbtn())if(dist(p.x,p.y,b.x,b.y)<b.r+12){tb[b.k]=true;hitBtn=true}
    if(!hitBtn&&p.x<W*.55){
      if(!tj.on||tj.id!==t.identifier){tj.on=true;tj.id=t.identifier;tj.ox=p.x;tj.oy=p.y}
      tj.x=cl((p.x-tj.ox)/50,-1,1);tj.y=cl((p.y-tj.oy)/50,-1,1);joy=true;
    }
  }
  if(!joy){tj.on=false;tj.x=tj.y=0}
}
function uiHit(px,py){const r=cv.getBoundingClientRect(),x=(px-r.left)/HS,y=(py-r.top)/HS;for(const b of btns)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return true}return false}
cv.addEventListener('touchstart',e=>{touchSync(e);if(state==='play')return;if(state==='title'||state==='lobby'||state==='hangar'){const t=e.changedTouches[0];uiHit(t.clientX,t.clientY);return}advance()},{passive:false});
cv.addEventListener('touchmove',touchSync,{passive:false});
cv.addEventListener('touchend',touchSync,{passive:false});
cv.addEventListener('touchcancel',touchSync,{passive:false});
cv.addEventListener('mousedown',e=>{initAudio();cv.focus();if(state==='play')return;if(state==='title'||state==='lobby'||state==='hangar'){uiHit(e.clientX,e.clientY);return}advance()});

function readInput(){
  let dx=0,dy=0;
  if(keys.ArrowLeft||keys.KeyA)dx--;if(keys.ArrowRight||keys.KeyD)dx++;
  if(keys.ArrowUp||keys.KeyW)dy--;if(keys.ArrowDown||keys.KeyS)dy++;
  const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
  if(tj.on&&(Math.abs(tj.x)>.15||Math.abs(tj.y)>.15)){dx=tj.x;dy=tj.y}
  return{dx,dy,fire:!!(keys.Space||tb.fire),rkt:!!(keys.KeyZ||keys.KeyJ||tb.rkt),hel:!!(keys.KeyX||keys.KeyK||tb.hel),use:!!(keys.KeyE||keys.KeyC||tb.use)};
}

/* ---------- effetti ---------- */
function say(t,d){msgs.push({t,life:d||2.6});if(msgs.length>3)msgs.shift()}
function spark(x,y,z,n,col){for(let i=0;i<n;i++)part.push({k:'sp',x,y,z,vx:rnd(-90,90),vy:rnd(-90,90),vz:rnd(20,120),life:rnd(.2,.5),max:.5,s:rnd(1,2),c:col||'#ffd27a'})}
function smoke(x,y,z,s){part.push({k:'sm',x,y,z,vx:rnd(-8,8),vy:rnd(-8,8),vz:rnd(14,34),life:rnd(.8,1.6),max:1.6,s:s||rnd(5,9),c:'60,56,50'})}
function boom(x,y,size,big){
  const n=Math.round(10*size);
  for(let i=0;i<n;i++){const a=rnd(0,TAU),v=rnd(10,70)*size;part.push({k:'fi',x,y,z:rnd(2,14),vx:Math.cos(a)*v,vy:Math.sin(a)*v,vz:rnd(20,70),life:rnd(.35,.8),max:.8,s:rnd(8,16)*size,c:'255,'+(120+Math.random()*100|0)+',40'})}
  for(let i=0;i<n*.6;i++)smoke(x+rnd(-10,10),y+rnd(-10,10),rnd(6,20),rnd(8,14)*size);
  spark(x,y,10,Math.round(8*size));part.push({k:'ring',x,y,z:0,vx:0,vy:0,vz:0,life:.45,max:.45,s:12*size,c:'255,226,160'});
  decals.push({x,y,r:rnd(12,22)*size});if(decals.length>150)decals.shift();
  shake=Math.max(shake,Math.min(1,.18*size*(dist(x,y,pl.x,pl.y)<500?1:.3)));
  sfx.boom(big);
  if(part.length>800)part.splice(0,part.length-800);
}
function dropCrate(x,y,id){crates.push({x,y,k:['a','f','m'][(id||0)%3],ph:0,id:'d'+id})}

/* ---------- proiettili ---------- */
function shoot(o){bul.push(Object.assign({life:2,own:0,dmg:1,spl:0,kind:'g',vz:0,tgt:null,turn:0,hp:1,age:0},o))}
function aimVec(x,y,tx,ty,tvx,tvy,sp,acc){
  const d=dist(x,y,tx,ty),t=d/sp;const px=tx+tvx*t*(acc||.8),py=ty+tvy*t*(acc||.8);return Math.atan2(py-y,px-x);
}
function findTarget(maxD,cone,pref){
  let best=null,bd=1e9;
  for(const e of en){
    if(e.t==='truck'&&!pref)continue;
    const d=dist(pl.x,pl.y,e.x,e.y);if(d>maxD||d>=bd)continue;
    if(Math.abs(angDiff(pl.h,Math.atan2(e.y-pl.y,e.x-pl.x)))>cone)continue;
    best=e;bd=d;
  }
  return best;
}
function playerFire(dt,inp){
  const HH=hs();
  pl.fcd-=dt;pl.rcd-=dt;pl.hcd-=dt;
  const c=Math.cos(pl.h),s=Math.sin(pl.h);
  if(inp.fire&&pl.fcd<=0&&pl.gun>0){
    pl.fcd=.075;pl.gun--;pl.side*=-1;
    const tg=findTarget(560,.2);let a=pl.h,td=380;
    if(tg){a=Math.atan2(tg.y-pl.y,tg.x-pl.x);td=dist(pl.x,pl.y,tg.x,tg.y)}
    a+=rnd(-.025,.025);const sp=720;
    shoot({x:pl.x+c*18-s*5*pl.side,y:pl.y+s*18+c*5*pl.side,z:pl.z-1,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,vz:(10-pl.z)/(td/sp),life:Math.min(.85,td/sp+.12),dmg:1*HH.gd,kind:'g'});
    sfx.gun();
  }
  if(inp.rkt&&pl.rcd<=0&&pl.rkt>0){
    pl.rcd=.2;pl.rkt--;pl.side*=-1;
    const tg=findTarget(620,.25);let a=pl.h,td=420;
    if(tg){a=Math.atan2(tg.y-pl.y,tg.x-pl.x);td=dist(pl.x,pl.y,tg.x,tg.y)}
    const sp=520;
    shoot({x:pl.x+c*14-s*9*pl.side,y:pl.y+s*14+c*9*pl.side,z:pl.z-3,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,vz:(10-pl.z)/(td/sp),life:Math.min(1.3,td/sp+.15),dmg:2.5*HH.rd,spl:40,kind:'r'});
    sfx.rkt();
  }
  if(inp.hel&&pl.hcd<=0&&pl.hel>0){
    pl.hcd=.7;pl.hel--;pl.side*=-1;
    const tg=findTarget(800,.7,true);const sp=430;
    shoot({x:pl.x+c*10-s*10*pl.side,y:pl.y+s*10+c*10*pl.side,z:pl.z-4,vx:c*sp,vy:s*sp,vz:0,life:3,dmg:8*HH.hd,spl:65,kind:'h',tgt:tg,turn:3.2});
    sfx.hel();
  }
}
function updBullets(dt){
  for(let i=bul.length-1;i>=0;i--){
    const b=bul[i];b.age+=dt;
    if((b.kind==='h'||b.kind==='s')&&b.tgt&&(b.tgt===pl?pl.alive:en.includes(b.tgt))){
      const tx=b.tgt.x,ty=b.tgt.y,sp=Math.hypot(b.vx,b.vy),cur=Math.atan2(b.vy,b.vx);
      const d=angDiff(cur,Math.atan2(ty-b.y,tx-b.x)),na=cur+cl(d,-b.turn*dt,b.turn*dt);
      b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;
      const tz=b.tgt===pl?pl.z:8;b.z+=(tz-b.z)*Math.min(1,dt*3);
    }else b.z+=b.vz*dt;
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.kind==='h'||b.kind==='s'||b.kind==='r'){if(Math.random()<.7)smoke(b.x,b.y,b.z,b.kind==='r'?3:4)}
    let done=b.life<=0||b.x<0||b.y<0||b.x>WS||b.y>WS;
    if(!done&&b.own===0){
      for(const q of bul){if(q.kind==='s'&&dist(b.x,b.y,q.x,q.y)<11){q.life=0;b.life=0;done=true;boom(q.x,q.y,.5);score+=25;break}}
      if(!done)for(const e of en){
        if(dist(b.x,b.y,e.x,e.y)<e.r+4){hurt(e,b.dmg);spark(b.x,b.y,b.z,4);done=true;break}
      }
      if(done||b.life<=0){
        if(b.spl)splash(b.x,b.y,b.spl,b.dmg*.7);
        if(b.spl)boom(b.x,b.y,b.kind==='h'?.9:.6);
      }
    }else if(!done&&b.own===1&&pl.alive){
      if(dist(b.x,b.y,pl.x,pl.y)<17){damage(b.dmg);done=true;if(b.kind==='s')boom(b.x,b.y,.7)}
    }
    if(done||b.life<=0){if(b.kind==='s'&&b.life<=0&&!done)boom(b.x,b.y,.5);if(b.own===2&&b.life<=0&&(b.kind==='r'||b.kind==='h'))boom(b.x,b.y,.5);bul.splice(i,1)}
  }
}
function splash(x,y,r,d,local){
  for(const e of en.slice()){const dd=dist(x,y,e.x,e.y);if(dd<r+e.r)hurt(e,d*(1-dd/(r+e.r)*.5),local)}
}
function hurt(e,d,remote){e.hp-=d;e.flash=.1;if(!remote&&net.on&&e.id!==undefined)net.dmg.set(e.id,(net.dmg.get(e.id)||0)+d);if(e.hp<=0)destroy(e,remote)}
function destroy(e,remote){
  const i=en.indexOf(e);if(i<0)return;en.splice(i,1);net.dead.add(e.id);if(!remote)netSend('kill',{id:e.id});
  const big=e.t==='depot'||e.t==='radar'||e.t==='hq'||e.t==='scud';
  boom(e.x,e.y,e.t==='depot'?2.4:e.t==='hq'?2.6:e.t==='radar'||e.t==='scud'?1.8:e.t==='bunker'?1.5:e.t==='heli'?1.4:e.t==='inf'?.4:1.1,big);
  score+=DEF[e.t].sc;
  if(e.t==='radar'){goal.radar++;say('Radar distrutto!  '+goal.radar+'/'+M.radar)}
  if(e.t==='scud'||e.t==='hq'){goal[e.t]++;say((e.t==='scud'?'Lanciamissili distrutto!  ':'Quartier generale distrutto!  ')+goal[e.t]+'/'+M[e.t]);
    splash(e.x,e.y,100,10,true);for(let k=0;k<8;k++)setTimeout(()=>{if(state==='play')boom(e.x+rnd(-40,40),e.y+rnd(-40,40),rnd(.5,1))},k*120)}
  if(e.t==='depot'){goal.depot++;say('Deposito distrutto!  '+goal.depot+'/'+M.depot);
    splash(e.x,e.y,110,12,true);if(pl.alive&&dist(e.x,e.y,pl.x,pl.y)<90)damage(12);
    for(let k=0;k<12;k++)setTimeout(()=>{if(state==='play')boom(e.x+rnd(-45,45),e.y+rnd(-45,45),rnd(.5,1))},k*110)}
  const roll=h01(e.id||0);
  if((e.t==='tank'&&roll<.3)||(e.t==='heli'&&roll<.6)||(e.t==='jeep'&&roll<.25)||(e.t==='truck'&&roll<.7)||(e.t==='inf'&&roll<.07))dropCrate(e.x,e.y,e.id||0);
}
function damage(d){
  if(!pl.alive)return;pl.armor-=d;pl.flash=.15;flashRed=.25;shake=Math.max(shake,.35);sfx.hit();
  if(pl.armor<=0)killPlayer('Elicottero abbattuto!');
}
function killPlayer(m){
  if(!pl.alive)return;pl.alive=false;pl.dead=2.4;lives--;boom(pl.x,pl.y,2,true);say(m,3);pl.pow=0;pl.winch=0;
}
function respawn(){
  pl.x=base.x;pl.y=base.y;pl.vx=pl.vy=0;pl.z=6;pl.alive=true;pl.armor=MAX.armor;pl.fuel=Math.max(pl.fuel,70);
  pl.gun=Math.min(MAX.gun,Math.max(pl.gun,300));pl.rkt=Math.min(MAX.rkt,Math.max(pl.rkt,16));pl.hel=Math.min(MAX.hel,Math.max(pl.hel,5));warned=false;cam.x=pl.x;cam.y=pl.y;
}

/* ---------- aggiornamento ---------- */
function updPlayer(dt,inp){
  if(!pl.alive){pl.dead-=dt;if(pl.dead<=0){if(lives<=0)state='over';else respawn()}return}
  const SPD=230*hs().spd,l=Math.hypot(inp.dx,inp.dy);
  let tx=0,ty=0;
  if(l>.05){tx=(inp.dx+2*inp.dy)/2*SPD;ty=(2*inp.dy-inp.dx)/2*SPD}
  const sp0=Math.hypot(pl.vx,pl.vy);
  const k=Math.min(1,dt*(l>.05?2.4:1.6));
  pl.vx+=(tx-pl.vx)*k;pl.vy+=(ty-pl.vy)*k;
  pl.x=cl(pl.x+pl.vx*dt,T*1.6,WS-T*1.6);pl.y=cl(pl.y+pl.vy*dt,T*1.6,WS-T*1.6);
  const sp=Math.hypot(pl.vx,pl.vy);
  if(sp>25){const d=angDiff(pl.h,Math.atan2(pl.vy,pl.vx));pl.h+=cl(d,-7*dt,7*dt)}
  pl.fuel-=dt*(.34+sp/1000)*hs().fuel;
  if(pl.fuel<25&&!warned){warned=true;say('CARBURANTE BASSO',3);sfx.warn()}
  if(pl.fuel>35)warned=false;
  if(pl.fuel<=0){pl.fuel=0;killPlayer('Carburante esaurito!');return}
  pl.rot+=dt*34;pl.flash=Math.max(0,pl.flash-dt);
  if(pl.z<30&&Math.random()<dt*45)dust(pl.x+rnd(-34,34),pl.y+rnd(-34,34));
  // rifornimenti
  for(let i=crates.length-1;i>=0;i--){const c=crates[i];if(dist(c.x,c.y,pl.x,pl.y)<28){
    if(c.k==='a'){pl.armor=Math.min(MAX.armor,pl.armor+35);say('+ Armatura')}
    else if(c.k==='f'){pl.fuel=Math.min(MAX.fuel,pl.fuel+40);say('+ Carburante')}
    else{pl.gun=Math.min(MAX.gun,pl.gun+200);pl.rkt=Math.min(MAX.rkt,pl.rkt+10);pl.hel=Math.min(MAX.hel,pl.hel+3);say('+ Munizioni')}
    netSend('cpk',{id:c.id});crates.splice(i,1);sfx.pick();score+=20}}
  // recupero prigionieri / atterraggio

function nearestObjective(){
  let b=null,bd=1e9;
  for(const e of en)if(e.obj){const d=dist(pl.x,pl.y,e.x,e.y);if(d<bd){bd=d;b=e}}

  for(const p of pows)if(p.st==='wait'){const d=dist(pl.x,pl.y,p.x,p.y);if(d<bd){bd=d;b=p}}
  return b||base;
}

    uiBtn('INIZIA LA MISSIONE','INVIO',()=>advance(),cx-150,y+84,isTouch);
    if(inv){uiBtn(lobbyCopied>0?'LINK COPIATO!':'COPIA LINK INVITO','LINK',()=>{const u=location.origin+location.pathname+'?r='+net.code+(curMap!=='rimini'?'&m='+curMap:'');try{navigator.clipboard.writeText(u);lobbyCopied=2}catch(e){prompt('Link invito',u)}},cx-150,y+132,isTouch)}
    uiBtn('INDIETRO','ESC',()=>leaveLobby(),cx-150,y+(inv?180:132),isTouch);
  }else if(state==='hangar'){
    veil(.8);
    const H=HELIS[hsel];
    txt('SCEGLI IL TUO ELICOTTERO',cx,34,Math.min(30,w/17),'#ffb347','center',700);
    txt('MISSIONE '+(mi+1)+' \u00b7 '+M.name,cx,56,13,'#d9b36c','center');
    const lx=14,ly=76,lw=Math.min(214,w*.27),rh=Math.max(28,Math.min(42,(h-176)/HELIS.length));
    HELIS.forEach((q,i)=>{const y=ly+i*rh,on=i===hsel;
      ctx.fillStyle=on?'rgba(255,179,71,.24)':'rgba(24,18,10,.62)';ctx.fillRect(lx,y,lw,rh-4);ctx.strokeStyle=on?'#ffb347':'rgba(255,179,71,.28)';ctx.lineWidth=on?1.6:1;ctx.strokeRect(lx+.5,y+.5,lw-1,rh-5);
      q.flag.forEach((f,k)=>{ctx.fillStyle=f;ctx.fillRect(lx+8+k*7,y+rh/2-8,7,14)});
      txt(q.short,lx+36,y+rh/2+1,Math.min(13,rh*.36),on?'#ffe9b0':'#f3e6c8',null,on?700:500);
      txt(q.cc,lx+36,y+rh/2+13,10,'rgba(243,230,200,.55)');
      btns.push({x:lx,y,w:lw,h:rh-4,fn:()=>{hsel=i}})});
    const sw=Math.min(262,w*.32),sx=w-14-sw,pcx=(lx+lw+sx)/2;
    // anteprima
    ctx.save();ctx.translate(pcx,h*.40);const sc=Math.min(2.7,(sx-lx-lw)/200);heliDetail=1;ctx.scale(sc,sc);
    {const gg=ctx.createRadialGradient(0,0,10,0,0,150);gg.addColorStop(0,'rgba(255,236,196,.42)');gg.addColorStop(1,'rgba(255,236,196,0)');ctx.fillStyle=gg;ctx.fillRect(-160,-110,320,220)}
    ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,26,52,14,0,0,TAU);ctx.fill();
    drawHeliObj({x:0,y:0,h:time*.55+.6,z:14,rot:time*34,alive:true,flash:0,winch:0},H.col,'',H);
    heliDetail=0;ctx.restore();
    const ty=h*.40+84*Math.min(1,sc/2.7);
    txt(H.name,pcx,ty,Math.min(20,w/38),'#ffb347','center',700);
    txt(H.country+' \u00b7 '+H.role,pcx,ty+20,12,'#d9b36c','center');
    wrap(H.desc,pcx,ty+44,Math.min(360,sx-lx-lw-24),18,13,'#f3e6c8');
    // statistiche
    panel(sx,ly,sw,Math.min(h-ly-76,330));
    const S=Math.max(0,Math.min(1,(H.spd-.8)/.4)),A=Math.min(1,H.arm/140),Rg=Math.max(0,Math.min(1,(1.2-H.fuel)/.4)),F=Math.min(1,H.gd*.4+H.ammo[1]/40*.3+H.ammo[2]/12*.3),C=H.cap/8;
    const rows=[['VELOCIT\u00c0',S,'#8bd450'],['ARMATURA',A,'#6aa9ff'],['AUTONOMIA',Rg,'#ffb347'],['POTENZA DI FUOCO',F,'#ff7a4a'],['POSTI PRIGIONIERI',C,'#e9d36a']];
    rows.forEach((r,i)=>{const y=ly+22+i*38;txt(r[0],sx+14,y,11,'rgba(243,230,200,.8)',null,600);ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(sx+14,y+7,sw-28,9);ctx.fillStyle=r[2];ctx.fillRect(sx+14,y+7,(sw-28)*r[1],9)});
    txt('Equipaggiamento',sx+14,ly+22+5*38,11,'rgba(243,230,200,.8)',null,600);
    ctx.font='500 12px '+FONT;{const ws=H.wpn.split(' \u00b7 ');ws.forEach((q2,i)=>txt('\u2022 '+q2,sx+14,ly+42+5*38+i*17,12,'#ffe9b0'))}
    txt('Posti: '+H.cap+' \u00b7 Armatura: '+H.arm,sx+14,ly+42+5*38+3*17+8,11,'rgba(243,230,200,.6)');
    uiBtn('SCEGLI E PROSEGUI','INVIO',()=>advance(),cx-150,h-54,isTouch);
    txt('\u2190 \u2192 per cambiare \u00b7 le prestazioni sono di gioco, ispirate ai modelli reali',cx,h-10,10,'rgba(243,230,200,.45)','center');
  }else if(state==='brief'){
    veil(.62);
    txt('MISSIONE '+(mi+1)+' DI '+MISSIONS.length,cx,h/2-86,13,'#d9b36c','center');
    txt(M.name,cx,h/2-52,Math.min(42,w/16),'#ffb347','center',700);
    wrap(M.txt,cx,h/2-14,Math.min(520,w-48),22,15,'#f3e6c8');
    const obj=[];if(M.radar)obj.push(M.radar+' radar da distruggere');if(M.depot)obj.push(M.depot+' depositi di carburante da distruggere');if(M.scud)obj.push(M.scud+' lanciamissili mobili da distruggere');if(M.hq)obj.push(M.hq+' quartier generale da radere al suolo');if(M.pow)obj.push(M.pow+' prigionieri da portare alla base (max 3 a bordo)');obj.push('Rientra alla base e atterra');
    obj.forEach((o,i)=>txt('• '+o,cx,h/2+38+i*22,14,'#ffe9b0','center'));
    txt('Le frecce indicano il prossimo obiettivo. Raccogli casse per armatura, carburante e munizioni.',cx,h/2+38+obj.length*22+14,12,'rgba(243,230,200,.6)','center');
    if(Math.floor(time*2)%2===0)txt(isTouch?'TOCCA PER DECOLLARE':'INVIO PER DECOLLARE',cx,h/2+38+obj.length*22+52,18,'#ffe9b0','center',700);
  }else if(state==='pause'){veil(.5);txt('PAUSA',cx,h/2,48,'#ffb347','center',700);txt('P o INVIO per continuare',cx,h/2+30,15,'#f3e6c8','center')}
  else if(state==='success'){veil(.55);txt('MISSIONE COMPIUTA',cx,h/2-20,Math.min(54,w/12),'#8bd450','center',700);txt('Punti '+score,cx,h/2+16,20,'#ffe9b0','center');txt(isTouch?'Tocca per continuare':'INVIO per continuare',cx,h/2+52,16,'#f3e6c8','center')}
  else if(state==='over'){veil(.7);txt('MISSIONE FALLITA',cx,h/2-14,Math.min(54,w/12),'#ff5a3c','center',700);txt('Punti '+score,cx,h/2+22,20,'#ffe9b0','center');txt(isTouch?'Tocca per ricominciare':'INVIO per ricominciare',cx,h/2+58,16,'#f3e6c8','center')}
  else if(state==='win'){veil(.7);txt('RIMINI LIBERATA',cx,h/2-20,Math.min(54,w/12),'#ffb347','center',700);txt('Punteggio finale '+score,cx,h/2+18,22,'#ffe9b0','center');txt(isTouch?'Tocca per tornare al titolo':'INVIO per tornare al titolo',cx,h/2+56,16,'#f3e6c8','center')}
  ctx.restore();
}
function wrap(t,x,y,mw,lh,size,col){
  ctx.font='500 '+size+'px '+FONT;const ws=t.split(' ');let line='',yy=y;
  for(const wd of ws){const test=line+wd+' ';if(ctx.measureText(test).width>mw&&line){txt(line.trim(),x,yy,size,col,'center');line=wd+' ';yy+=lh}else line=test}
  txt(line.trim(),x,yy,size,col,'center');
}

/* ---------- render ---------- */
const items=[];
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#2f7794';ctx.fillRect(0,0,W,H);
  CSX=ix(cam.x,cam.y);CSY=iy(cam.x,cam.y,0);VX=W/2/Z;VY=H/2/Z;
  const sx=shake>0?rnd(-1,1)*shake*7:0,sy=shake>0?rnd(-1,1)*shake*7:0;
  ctx.setTransform(DPR*Z,0,0,DPR*Z,DPR*(W/2-CSX*Z+sx),DPR*(H/2-CSY*Z+sy));
  if(!NOISE)NOISE=mkNoisePat();
  drawTerrain();drawShadows();
  items.length=0;
  for(const d of decor)if(vis(d.x,d.y,110))items.push({d:d.x+d.y,k:d.t==='palm'?1:d.t==='rock'?2:3,o:d});
  for(const e of en)if(vis(e.x,e.y,80))items.push({d:e.x+e.y,k:4,o:e});
  for(const p of pows)if(p.st==='wait'&&vis(p.x,p.y,60))items.push({d:p.x+p.y,k:5,o:p});
  for(const c of crates)if(vis(c.x,c.y,60))items.push({d:c.x+c.y,k:6,o:c});
  if(pl.alive)items.push({d:pl.x+pl.y+10,k:7,o:pl});
  for(const k in net.ghosts){const g=net.ghosts[k];if(vis(g.x,g.y,100))items.push({d:g.x+g.y+10,k:8,o:g})}
  items.sort((a,b)=>a.d-b.d);
  for(const it of items){const o=it.o;
    switch(it.k){case 1:drawPalm(o);break;case 2:drawRock(o);break;case 3:drawHouse(o);break;case 4:drawEnt(o);break;
      case 5:{ctx.save();const r=o.prog>0?1:0;gpoly(o.x,o.y,30,30,0,0,null,'rgba(240,235,210,.5)',20);drawInf({x:o.x,y:o.y,t:o.t,tang:0},true);marker(o.x,o.y,40,'#6aa9ff');ctx.restore();break}
      case 6:drawCrate(o);break;case 7:drawHeliObj(pl,hs().col,net.on?CALL[net.idx%6]:'',hs(),HC[net.idx%6]);break;case 8:{const gh=HELIS[o.hm|0]||HELIS[0];drawHeliObj(o,gh.col,o.tag,gh,HC[o.idx%6]);break}}
  }
  drawBullets();drawParts();drawArrow();
  postFX();
  drawHUD();
}

/* ---------- ciclo ---------- */
let last=performance.now();
function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  try{update(dt);render()}catch(err){console.error(err)}
  requestAnimationFrame(frame);
}
loadMission(0);
window.__dg={net,enterLobby,get mi(){return mi},get state(){return state},get pl(){return pl},get en(){return en},get goal(){return goal},advance,keys,setMission:(m)=>{loadMission(m)},get score(){return score}};
requestAnimationFrame(frame);
})();
</script>

<script>
/* PWA: service worker + schermo intero/landscape al primo tocco su dispositivi touch */
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
addEventListener('pointerdown',function f(e){
  if(e.pointerType!=='touch')return;removeEventListener('pointerdown',f);
  try{const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().then(()=>{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}).catch(()=>{})}catch(x){}
},{passive:true});
</script>
